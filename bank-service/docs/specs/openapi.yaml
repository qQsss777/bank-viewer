openapi: 3.1.0
info:
  title: Expense API
  version: 1.0.0

servers:
  - url: http://localhost:2003

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Expense:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        amount:
          type: number
          format: float
        category_id:
          type: string
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    ExpenseCreateRequest:
      type: object
      required:
        - title
        - amount
        - category_id
        - date
      properties:
        title:
          type: string
        description:
          type: string
        amount:
          type: number
          format: float
          minimum: 0.01
        category_id:
          type: string
        date:
          type: string
          format: date

    ExpenseUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        amount:
          type: number
          format: float
          minimum: 0.01
        category_id:
          type: string
        date:
          type: string
          format: date

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    CategoryCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    PaginatedExpenses:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /expenses:
    get:
      summary: List user expenses
      operationId: listExpenses
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: category_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: min_amount
          in: query
          schema:
            type: number
            format: float
        - name: max_amount
          in: query
          schema:
            type: number
            format: float
      responses:
        "200":
          description: Paginated list of expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedExpenses"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Add a new expense
      operationId: addExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreateRequest"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /expenses/{expenseId}:
    put:
      summary: Update an existing expense
      operationId: updateExpense
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdateRequest"
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "404":
          description: Expense not found

    delete:
      summary: Delete an expense
      operationId: deleteExpense
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expense deleted
        "401":
          description: Unauthorized
        "404":
          description: Expense not found

  /categories:
    get:
      summary: List categories
      operationId: listCategories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          description: Unauthorized

    post:
      summary: Add a new category
      operationId: addCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /categories/{categoryId}:
    delete:
      summary: Delete a category
      operationId: deleteCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category deleted
        "401":
          description: Unauthorized
        "404":
          description: Category not found