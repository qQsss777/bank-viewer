openapi: 3.1.0
info:
  title: Auth API
  version: 1.0.0

servers:
  - url: http://localhost:1003

paths:
  /auth/signin:
    post:
      summary: Sign in an existing user
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        "401":
          description: Invalid credentials

  /auth/create-account:
    post:
      summary: Create a new user account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                username:
                  type: string
      responses:
        "201":
          description: Account created
        "400":
          description: Invalid input or account already exists

  /auth/logout:
    post:
      summary: Logout current user
      operationId: logout
      responses:
        "200":
          description: User logged out successfully

  /auth/validate-token:
    post:
      summary: Validate an authentication token
      operationId: validateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
        "401":
          description: Token invalid or expired
  
  /auth/unvalidate-token:
    post:
      summary: Unvalidate an authentication token
      operationId: unValidateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Token is unvalided
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
        "401":
          description: Token invalided
